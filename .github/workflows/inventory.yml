name: repo-inventory

on:
  schedule:
    # 每周一 03:23 UTC（周度清点，避开整点/半点拥塞）
    - cron: "23 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inventory both orgs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/inventory.py

      - name: Commit updates (if any)
        run: |
          if git diff --quiet -- data/repos.json README.md; then
            echo "inventory unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json README.md
          git commit -m "chore: weekly repo inventory $(date -u +%F)"
          git push
